<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Demo Bank</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f2f4f7;
      color: #222;
    }

    header {
      background: #123c69;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .demo {
      background: #fff3cd;
      color: #664d03;
      padding: 12px;
      text-align: center;
      font-weight: bold;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .balance {
      font-size: 32px;
      font-weight: bold;
      margin: 10px 0 25px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #123c69;
      color: white;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <header>
    <h1>My Demo Bank</h1>
  </header>

  <div class="demo">
    DEMO ONLY — NOT A REAL BANK
  </div>

  <div class="container">
    <div class="card">
      <h2>Welcome, Demo User</h2>

      <p>Demo Balance</p>
      <div class="balance">₦50,000.00</div>

      <button onclick="alert('Demo transaction only')">
        Send Money
      </button>

      <button onclick="alert('Demo transaction only')">
        Receive Money
      </button>
    </div>
  </div>

</body>
</html>
