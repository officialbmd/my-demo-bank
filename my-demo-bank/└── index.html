<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northstar Demo Bank</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f5f7;
  color: #17202a;
}

/* DEMO LABEL */
.demo-banner {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #fff3cd;
  color: #664d03;
  text-align: center;
  padding: 9px 12px;
  font-size: 12px;
  font-weight: 800;
  border-bottom: 1px solid #e6d18a;
}

/* HEADER */
.header {
  background: #123f67;
  color: white;
  padding: 18px 20px 30px;
  text-align: center;
  box-shadow: 0 3px 8px rgba(0,0,0,.18);
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 25px;
}

.back {
  font-size: 15px;
  opacity: .9;
}

.bank-name {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: .5px;
}

.menu {
  font-size: 22px;
}

.balance-label {
  font-size: 16px;
  text-decoration: underline;
  opacity: .95;
}

.balance {
  font-size: 38px;
  font-weight: 800;
  margin: 8px 0;
  letter-spacing: -1px;
}

.balance-details {
  font-size: 15px;
  margin-top: 12px;
  opacity: .95;
}

/* CONTENT */
.container {
  max-width: 600px;
  margin: auto;
  padding-bottom: 90px;
}
