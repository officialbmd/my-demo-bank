<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fictional Demo Bank</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
  color: #172033;
}

.demo-warning {
  background: #fff3cd;
  color: #664d03;
  text-align: center;
  padding: 10px;
  font-weight: bold;
  font-size: 13px;
}

.header {
  background: #092957;
  color: white;
  padding: 20px;
}

.header h1 {
  margin: 0;
  font-size: 22px;
}

.header p {
  margin: 6px 0 0;
  opacity: .8;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.balance-card {
  background: #092957;
  color: white;
  border-radius: 20px;
  padding: 25px;
  margin-bottom: 20px;
  box-shadow: 0 5px 18px rgba(0,0,0,.12);
}

.balance-label {
  opacity: .8;
  font-size: 14px;
}

.balance {
  font-size: 36px;
  font-weight: bold;
  margin: 12px 0;
}

.demo-text {
  font-size: 12px;
  opacity: .75;
}

.buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 18px;
  cursor: pointer;
  background: white;
  color: #092957;
  font-weight: bold;
}

.section-title {
  margin-top: 25px;
}

.services {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.service {
  background: white;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.service-icon {
  font-size: 25px;
}

.transactions {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  margin-top: 15px;
}

.transaction {
  display: flex;
  justify-content: space-between;
  padding: 16px;
  border-bottom: 1px solid #eee;
}

.transaction:last-child {
  border-bottom: 0;
}

.footer {
  text-align: center;
  padding: 30px 10px;
  color: #777;
  font-size: 12px;
}

@media (min-width: 600px) {
  .services {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>

<div class="demo-warning">
  ⚠️ FICTIONAL DEMO — NOT A REAL BANK ACCOUNT — NO REAL MONEY
</div>

<div class="header">
  <h1>Fictional Demo
